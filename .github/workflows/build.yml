name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etiqueta de la release a publicar con el APK y el IPA (ej. v1.0.0). Vacío = solo compilar."
        required: false
        default: ""

env:
  # Con etiqueta v* o con release_tag manual se publica una release; si no, solo se compila.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar plataformas
        run: ./tool/bootstrap_platforms.sh
      - run: flutter pub get
      - name: Análisis estático
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Compilar APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: scannapp-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (sin firma)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar plataformas
        run: ./tool/bootstrap_platforms.sh
      - run: flutter pub get
      - name: Compilar iOS (sin firma)
        run: flutter build ios --release --no-codesign
      # Solo al publicar una versión se genera el .ipa; en una compilación normal
      # basta con comprobar que compila y no se guarda nada.
      - name: Generar IPA sin firmar
        if: env.RELEASE_TAG != ''
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Scannapp-unsigned.ipa Payload
      - name: Guardar IPA
        if: env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: scannapp-ios-ipa
          path: Scannapp-unsigned.ipa

  publish:
    name: Publicar release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para crear la release y adjuntar los archivos
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: scannapp-*
          path: dist
          merge-multiple: true
      - name: Nombrar archivos con la versión
        run: |
          mv dist/app-release.apk "dist/scannapp-${RELEASE_TAG}.apk"
          mv dist/Scannapp-unsigned.ipa "dist/scannapp-${RELEASE_TAG}-ios-sin-firmar.ipa"
          ls -l dist
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Scannapp ${{ env.RELEASE_TAG }}
          files: dist/*
          generate_release_notes: true
