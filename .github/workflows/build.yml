name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etiqueta de la release a publicar con el APK (ej. v1.0.0). Vacío = solo compilar."
        required: false
        default: ""

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para adjuntar el APK a la release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar plataformas
        run: ./tool/bootstrap_platforms.sh
      - run: flutter pub get
      - name: Análisis estático
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Compilar APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: scannapp-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Calcular etiqueta de release
        id: rel
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Nombrar APK con la versión
        if: steps.rel.outputs.tag != ''
        run: cp build/app/outputs/flutter-apk/app-release.apk "scannapp-${{ steps.rel.outputs.tag }}.apk"
      - name: Publicar release con el APK
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Scannapp ${{ steps.rel.outputs.tag }}
          files: scannapp-${{ steps.rel.outputs.tag }}.apk
          generate_release_notes: true

  ios:
    name: iOS (sin firma)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar plataformas
        run: ./tool/bootstrap_platforms.sh
      - run: flutter pub get
      - name: Compilar iOS (sin firma)
        run: flutter build ios --release --no-codesign
      - name: Empaquetar Runner.app
        run: |
          cd build/ios/iphoneos
          zip -qr "$GITHUB_WORKSPACE/Runner-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: scannapp-ios-unsigned
          path: Runner-unsigned.zip
