name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar plataformas
        run: ./tool/bootstrap_platforms.sh
      - run: flutter pub get
      - name: Análisis estático
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Compilar APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: scannapp-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (sin firma)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar plataformas
        run: ./tool/bootstrap_platforms.sh
      - run: flutter pub get
      - name: Compilar iOS (sin firma)
        run: flutter build ios --release --no-codesign
      - name: Empaquetar Runner.app
        run: |
          cd build/ios/iphoneos
          zip -qr "$GITHUB_WORKSPACE/Runner-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: scannapp-ios-unsigned
          path: Runner-unsigned.zip
