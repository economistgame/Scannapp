name: caja_scanner
description: App offline-first para registrar pedidos, proveedor y líneas de cajas mediante escaneo de códigos de barras.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.2.3
  sqflite: ^2.3.3
  path: ^1.9.0
  connectivity_plus: ^6.0.5
  uuid: ^4.4.2
  http: ^1.2.2
  intl: ^0.19.0
  path_provider: ^2.1.4
  flutter_email_sender: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
